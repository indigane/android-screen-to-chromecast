# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This project declares no AndroidX dependencies (the app uses only the Android framework, the
# Kotlin stdlib and the :core module). The flag is left at its default `true` because
# `android.useAndroidX=false` is deprecated and slated for removal in AGP 10; with no AndroidX
# artifacts on the classpath the flag has no practical effect either way.
android.useAndroidX=true

# Recommended for faster builds by making R classes non-transitive.
android.nonTransitiveRClass=true

# Define Kotlin code style (used by IDEs for formatting).
kotlin.code.style=official
